apis:
- aid: bentoml:bentoml-service-api
  name: BentoML Service REST API
  description: >
    Auto-generated REST API endpoints produced when BentoML services are deployed. Each decorated service
    method becomes an HTTP POST endpoint. Supports custom routes, path prefixes, adaptive batching, async
    task queues, and context-aware request/response handling for model inference workloads.
  humanURL: https://docs.bentoml.com/en/latest/build-with-bentoml/services.html
  baseURL: https://localhost:3000
  tags:
  - Inference
  - REST API
  - model serving
  tags_raw:
  - inference
  - REST API
  - model serving
  properties:
  - type: Documentation
    url: https://docs.bentoml.com/en/latest/build-with-bentoml/services.html
- aid: bentoml:bentoml-sdk
  name: BentoML Python SDK
  description: >
    Core Python SDK for packaging models as Bentos, managing the model store, building container images,
    and interacting with BentoML services programmatically including client-side API calls to deployed
    inference endpoints.
  humanURL: https://docs.bentoml.com/en/latest/reference/bentoml/index.html
  baseURL: https://pypi.org/project/bentoml/
  tags:
  - SDK
  - Python
  - model packaging
  properties:
  - type: Documentation
    url: https://docs.bentoml.com/en/latest/reference/bentoml/index.html
- aid: bentoml:bentocloud-token-api
  name: BentoCloud API Token Management
  description: >
    API for creating, listing, retrieving, and deleting API tokens used to authenticate with BentoCloud
    services. Supports scoped tokens with granular permissions including API access, organization read/write,
    and cluster read/write.
  humanURL: https://docs.bentoml.com/en/latest/reference/bentocloud/bentocloud-api.html
  baseURL: https://cloud.bentoml.com
  tags:
  - Authentication
  - Tokens
  - Security
  tags_raw:
  - authentication
  - tokens
  - security
  properties:
  - type: Documentation
