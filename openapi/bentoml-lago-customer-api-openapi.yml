openapi: 3.2.0
info:
  title: yatai api server lago customer API
  description: This is yatai api server.
  version: 1.0.0
tags:
- name: lago customer
  description: lago customer api
paths:
  /api/v1/lago/customers:
    get:
      tags:
      - lago customer
      summary: List lago customers
      operationId: ListLagoCustomers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schemasv1LagoCustomerListSchema'
      x-operation-id-source: normalized
      x-operation-id-original: List lago customers
    post:
      tags:
      - lago customer
      summary: Create lago customer
      operationId: CreateLagoCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create_Lago_CustomerInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schemasv1LagoCustomer'
      x-operation-id-source: normalized
      x-operation-id-original: Create lago customer
  /api/v1/lago/customers/{customerId}:
    put:
      tags:
      - lago customer
      summary: Update lago customer
      operationId: UpdateLagoCustomer
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Update_Lago_CustomerInput'
      responses:
        '200':
          description: OK
      x-operation-id-source: normalized
      x-operation-id-original: Update lago customer
components:
  schemas:
    Schemasv1LagoCustomer:
      type: object
      properties:
        email:
          type: string
        lago_id:
          type: string
        limit_group_plan:
          type: string
        name:
          type: string
        subscription_id:
          type: string
        wallet_id:
          type: string
    Create_Lago_CustomerInput:
      type: object
      properties:
        Uid:
          type: string
        auto_create_stripe:
          type: boolean
        credit_amount:
          type:
          - string
          - 'null'
        email:
          type: string
        limit_group_plan:
          type: string
        name:
          type: string
        plan_type:
          type: string
    Schemasv1LagoCustomerListSchema:
      type: object
      properties:
        count:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/Schemasv1LagoCustomer'
        start:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
    Update_Lago_CustomerInput:
      type: object
      properties:
        stripe_id:
          type:
          - string
          - 'null'
  securitySchemes:
    apiToken:
      type: apiKey
      in: header
      name: X-YATAI-API-TOKEN
