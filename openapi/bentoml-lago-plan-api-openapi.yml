openapi: 3.2.0
info:
  title: yatai api server lago plan API
  description: This is yatai api server.
  version: 1.0.0
tags:
- name: lago plan
  description: lago plan api
paths:
  /api/v1/lago/plans:
    get:
      tags:
      - lago plan
      summary: List lago plans
      operationId: ListLagoPlans
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schemasv1LagoPlanListSchema'
      x-operation-id-source: normalized
      x-operation-id-original: List lago plans
    post:
      tags:
      - lago plan
      summary: Create lago plan
      operationId: CreateLagoPlan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create_Lago_PlanInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schemasv1Plan'
      x-operation-id-source: normalized
      x-operation-id-original: Create lago plan
  /api/v1/lago/plans/{planName}:
    put:
      tags:
      - lago plan
      summary: Update lago plan
      operationId: UpdateLagoPlan
      parameters:
      - name: planName
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Update_Lago_PlanInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schemasv1Plan'
      x-operation-id-source: normalized
      x-operation-id-original: Update lago plan
components:
  schemas:
    Create_Lago_PlanInput:
      type: object
      properties:
        charges:
          type: array
          items:
            $ref: '#/components/schemas/Schemasv1Charge'
        description:
          type: string
        display_name:
          type: string
        name:
          type: string
    Schemasv1LagoPlanListSchema:
      type: object
      properties:
        count:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/Schemasv1Plan'
        start:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
    Update_Lago_PlanInput:
      type: object
      properties:
        charges:
          type: array
          items:
            $ref: '#/components/schemas/Schemasv1Charge'
        description:
          type:
          - string
          - 'null'
        display_name:
          type:
          - string
          - 'null'
    Schemasv1Plan:
      type: object
      properties:
        charges:
          type: array
          items:
            $ref: '#/components/schemas/Schemasv1Charge'
        description:
          type: string
        display_name:
          type: string
        lago_id:
          type: string
        name:
          type: string
    Schemasv1Charge:
      type: object
      properties:
        price:
          type: string
        resource_instance:
          type: string
  securitySchemes:
    apiToken:
      type: apiKey
      in: header
      name: X-YATAI-API-TOKEN
